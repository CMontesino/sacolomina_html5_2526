<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chubasqueros SL</title>

    <!-- CSS DE LOS COMPONENTES PRINCIPALES DE LA PÁGINA -->
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/components/header.css">
    <link rel="stylesheet" href="assets/css/components/aside.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
    <link rel="stylesheet" href="assets/css/components/main.css">

    <!-- CSS DEL CONTENIDO DE CADA PÁGINA ESPECÍFICO -->
    <link rel="stylesheet" href="assets/css/pages/index.css">
    

    <!-- FAVICON -->
    <link rel="icon" type="icon" href="assets/images/Chubasquero.ico">
    <!-- Bootstrap ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    
    
    
    <!-- Google Fonts -->
    <!-- Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

</head>
<body>

    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="assets/images/Chubasquero.webp" width="70px">
                <span>Chubasqueros SL</span>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <div class="overlay"></div>
            
            <label for="menu-toggle" class="hamburger">
                <i class="bi bi-list"></i>
            </label>

            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="./index.html"><i class="bi bi-house"></i><span>Inicio</span></a></li>
                    <li><a href="./pages/about.html"><i class="bi bi-person-raised-hand"></i><span>About</span></a></li>
                    <li><a href="./pages/login.html"><i class="bi bi-door-open"></i><span>Login</span></a></li>
                    <li><a href="./pages/registro.html"><i class="bi bi-box-arrow-in-right"></i><span>SignUp</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <aside>
        <!--Anuncio de chubasqueros-->
        <div class="promo-banner">
            <div class="promo-content">
                <h2>¡No dejes que la lluvia arruine tu día!</h2>
                <p>Descubre nuestros <strong>chubasqueros impermeables</strong>, ligeros y con estilo.</p>
                <p class="offer">🎉 Oferta especial: ¡10% de descuento hoy!</p>
                <a href="/pages/about.html" class="promo-btn">Comprar Ahora</a>
            </div>
        </div>
        <!--Estilo de anuncio-->
        <style>
        .promo-banner {
            background: linear-gradient(135deg, #4a90e2, #50e3c2);
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: 'Arial', sans-serif;
            transition: transform 0.3s ease;
        }

        .promo-banner:hover {
            transform: scale(1.02);
        }

        .promo-content h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .promo-content p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .promo-content .offer {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .promo-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #ffcc00;
            color: #333;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .promo-btn:hover {
            background-color: #e6b800;
            color: #000;
        }

        @media (max-width: 600px) {
            .promo-content h2 {
            font-size: 1.5rem;
            }

            .promo-content p {
            font-size: 1rem;
            }
        }
        @media (max-width: 770px) {
            .promo-banner{
                max-width: 225px;
            }
        }
        </style>
    </aside>

    <main>

            
    </main>

    

    <footer>
        <p>&copy; Chuvasqueros SL - Todos los derechos reservados.</p>
        <nav>
            <a href="./pages/aviso-legal.html">Privacidad</a> | 
            <a href="./pages/cookies.html">Cookies</a>
        </nav>
    </footer>

</body>
</html>
